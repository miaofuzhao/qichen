<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>企业官网首页</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            color: #333;
            background-color: #f6f7f9;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* 顶部导航 */
        header {
            background: #0f172a;
            color: #fff;
        }

        .nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        .nav ul li a {
            color: #cbd5e1;
            font-size: 15px;
        }

        .nav ul li a:hover {
            color: #fff;
        }

        /* 横幅 */
        .hero {
            background: linear-gradient(120deg, #0f172a, #1e293b);
            color: #fff;
            padding: 100px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            color: #e2e8f0;
            max-width: 700px;
            margin: 0 auto 40px;
        }

        .hero button {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .hero button:hover {
            background: #1d4ed8;
        }

        /* 内容区 */
        .container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .section-title p {
            color: #64748b;
            font-size: 16px;
        }

        /* 卡片 */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        .card h3 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .card p {
            color: #555;
            font-size: 15px;
        }

        /* 底部 */
        footer {
            background: #0f172a;
            color: #94a3b8;
            padding: 40px 20px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <div class="nav">
        <div class="logo">LOGO</div>
        <ul>
            <li><a href="#">首页</a></li>
            <li><a href="#">服务</a></li>
            <li><a href="#">案例</a></li>
            <li><a href="#">关于我们</a></li>
            <li><a href="#">联系我们</a></li>
        </ul>
    </div>
</header>

<section class="hero">
    <h1>专注创造长期价值</h1>
    <p>
        我们致力于为客户提供稳定、可靠、可持续的解决方案，
        用专业与责任构建值得信赖的品牌。
    </p>
    <button>了解更多</button>
</section>

<section class="container">
    <div class="section-title">
        <h2>我们的优势</h2>
        <p>以结果为导向的专业服务体系</p>
    </div>

    <div class="cards">
        <div class="card">
            <h3>专业团队</h3>
            <p>多年行业经验，专注细节，确保每一个项目稳定落地。</p>
        </div>
        <div class="card">
            <h3>高效执行</h3>
            <p>标准化流程与清晰目标，缩短周期，降低不确定性。</p>
        </div>
        <div class="card">
            <h3>长期合作</h3>
            <p>不是一次成交，而是建立长期、可持续的合作关系。</p>
        </div>
    </div>
</section>

<footer>
    © 2025 公司名称 · 保留所有权利
</footer>

</body>
</html>
